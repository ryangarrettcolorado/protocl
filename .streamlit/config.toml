[server]
headless = true
runOnSave = false
fileWatcherType = "auto"
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#C9A24B"
backgroundColor = "#F6F2EC"
secondaryBackgroundColor = "#EFEAE2"
textColor = "#1C1F22"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
