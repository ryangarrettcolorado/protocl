[server]
headless = true
runOnSave = false
fileWatcherType = "auto"
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
# Locked to dark — Protocōl's identity is gold-on-near-black.
# All component CSS in modules/theme.py is built against this palette.
base = "dark"
primaryColor = "#FFB612"
backgroundColor = "#0E0E10"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F2F2F2"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
