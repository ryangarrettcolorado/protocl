[server]
headless = true
runOnSave = false
fileWatcherType = "auto"
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
# v2 brand: Teal scheme, light by default. Dark mode is supported by the app
# via a session-level toggle; the Streamlit baseline below is the LIGHT palette
# because Streamlit's base= can't be flipped at runtime. The component CSS in
# protocl/modules/theme.py uses CSS custom properties keyed off
# body[data-theme="dark|light"] to switch surfaces and text colors for the rest
# of the UI. See docs/BRAND.md for the canonical token contract.
base = "light"
primaryColor = "#01696F"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#F9F8F5"
textColor = "#28251D"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
