name: Daily Sync

on:
  schedule:
    # Every 6 hours: 05:00, 11:00, 17:00, 23:00 UTC
    # (= 11p, 5a, 11a, 5p Mountain). Health Auto Export typically drops a
    # new file every 6h; this schedule picks each one up within the hour.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # HealthKit → Drive sync (no-op if either secret is unset)
          HEALTH_AUTO_EXPORT_DRIVE_FOLDER_ID: ${{ secrets.HEALTH_AUTO_EXPORT_DRIVE_FOLDER_ID }}
          HEALTH_AUTO_EXPORT_ARCHIVE_FOLDER_ID: ${{ secrets.HEALTH_AUTO_EXPORT_ARCHIVE_FOLDER_ID }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -f scripts/daily_sync.py ]; then
            python scripts/daily_sync.py
          else
            echo "scripts/daily_sync.py not found — skipping"
          fi

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pick up CSV mutations from both the legacy Strava sync (data/)
          # and the Health Auto Export ingester (protocl/data/ryan/).
          git add data/ protocl/data/ryan/ || true
          git diff --staged --quiet || git commit -m "chore(sync): healthkit + strava $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
