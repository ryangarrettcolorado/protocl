  - canonical_key: ferritin
    display_name: "Ferritin"
    category: inflammation
    tier: 1
    direction: mid_range
    units: "ng/mL"
    aliases: ["serum ferritin", "ferritin level"]
    ranges:
      optimal_min: 60
      optimal_max: 120
      borderline_min: 30
      borderline_max: 60
      out_of_range_low_max: 30
      out_of_range_high_min: 200
    source_citation: "Superpower.com optimal ferritin review (men 60–120 ng/mL, women 45–80 ng/mL); Bronson Health analysis (>50 ng/mL operationally important); longevity studies: ferritin >400 ng/mL significantly shorter median survival"
    source_url: "https://superpower.com/blog/optimal-ferritin"
    notes: >
      Ranges above reflect male optimal; female optimal: 45–80 ng/mL (borderline 15–45,
      out-of-range-low <15, out-of-range-high >150). Ferritin is both an iron storage marker
      AND an acute phase reactant — elevated ferritin from inflammation can mask iron
      deficiency. Standard lab upper limits (~300–566 ng/mL for men) are far too permissive
      from a longevity standpoint; high ferritin linked to shorter telomere length and
      increased all-cause mortality.

