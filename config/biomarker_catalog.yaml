# =====================================================================
# Protocōl Biomarker Catalog
# =====================================================================
# Source of truth for all biomarkers Protocōl can ingest, score, and
# render. Adding a marker is a YAML edit, not a code change.
#
# Total markers: 118
# Categories: lipids, metabolic, inflammation, hormones, thyroid, liver_kidney, vitamins, cbc, urinalysis
#
# Tiers:
#   1 = High-signal (Attia Tier-1, ApoB primacy, glycemic, etc.)
#   2 = Clinically useful (thyroid, vitamins, electrolytes)
#   3 = Supplementary (CBC differentials, urinalysis sediments)
#
# Directions:
#   lower_is_better  — e.g. ApoB, HbA1c, hs-CRP
#   higher_is_better — e.g. HDL-C, Vitamin D
#   mid_range        — banded optimal (e.g. testosterone, sodium)
#   binary_flag      — present/absent (e.g. urinalysis crystals, blasts)
#
# Ranges (US conventional units):
#   optimal_min / optimal_max         — the band Protocōl shades green
#   borderline_min / borderline_max   — amber band (caution)
#   out_of_range_low_max              — red band below this value
#   out_of_range_high_min             — red band above this value
#   null = not applicable (e.g. binary_flag markers have no bands)
#
# Generated: 2026-05-30
# =====================================================================

