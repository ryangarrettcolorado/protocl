    source_citation: "Attia Outlive 2023; ACC now recommends hs-CRP for everyone per Empirical Health 2025; AHA 2003 cardiovascular risk classification (<1/1–3/>3 mg/L)"
    source_url: "https://empirical.health/blog/peter-attia-outlive-labs/"
    notes: >
