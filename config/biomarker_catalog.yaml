    notes: >
      Should be NEGATIVE; positive LE indicates pyuria (WBCs in urine) from UTI, urethritis,
      interstitial nephritis, or bladder irritation; sensitivity 75–90%, specificity 95% for
      UTI; >5 WBCs/hpf on microscopy confirms pyuria; false positive: vaginal contamination,
      trichomonas. Binary flag.

